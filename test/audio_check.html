<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio check</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #15130f; color: #e8e0cc; font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; } h2 { font-size: 14px; margin: 18px 0 6px; color: #c9b27a; }
  p { margin: 0 0 8px; color: #a99f88; }
  button { margin: 2px; padding: 6px 10px; background: #2a251c; color: #e8e0cc; border: 1px solid #5a4d33; border-radius: 4px; cursor: pointer; }
  button:hover { background: #3a3326; } button.on { background: #6b5526; }
  label { margin-right: 12px; }
  pre { white-space: pre-wrap; color: #8f8670; font-size: 12px; }
</style>
</head>
<body>
<h1>Cathedral audio — audition &amp; checks</h1>
<p>Click any button to start audio (the first click unlocks the AudioContext). The automated check is <code>node test/audio_check.mjs</code>.</p>
<h2>Music</h2><div id="music"></div>
<h2>SFX</h2><div id="sfx"></div>
<h2>Mix</h2>
<div>
  <label>master <input id="vm" type="range" min="0" max="1" step="0.01" value="1"></label>
  <label>music <input id="vmu" type="range" min="0" max="1.5" step="0.01" value="1"></label>
  <label>sfx <input id="vs" type="range" min="0" max="1.5" step="0.01" value="1"></label>
  <label><input id="spatial" type="checkbox"> spatial (random position around the listener)</label>
  <button id="duck">duck(0.6, 1.5)</button>
</div>
<pre id="log"></pre>
<script type="module">
import { AudioSystem, SFX_NAMES, MUSIC_STATES, SFX_DURATION } from '../src/audio.js';

const SR = 48000;

// ---------------------------------------------------------------- analysis helpers
function analyze(buf, activeDb = -35) {
  const ch = buf.numberOfChannels, n = buf.length, sr = buf.sampleRate;
  const data = Array.from({ length: ch }, (_, c) => buf.getChannelData(c));
  let peak = 0, sum = 0, nan = 0, clip = 0;
  const chSum = new Array(ch).fill(0), chDc = new Array(ch).fill(0);
  for (let c = 0; c < ch; c++) {
    const d = data[c];
    for (let i = 0; i < n; i++) {
      const x = d[i];
      if (!Number.isFinite(x)) { nan++; continue; }
      const ax = Math.abs(x);
      if (ax > peak) peak = ax;
      if (ax > 0.97) clip++;
      sum += x * x; chSum[c] += x * x; chDc[c] += x;
    }
  }
  const W = Math.round(sr * 0.01), nw = Math.floor(n / W), env = new Float32Array(nw);
  for (let w = 0; w < nw; w++) {
    let s = 0;
    for (let c = 0; c < ch; c++) { const d = data[c]; for (let i = w * W; i < (w + 1) * W; i++) { const x = d[i]; if (Number.isFinite(x)) s += x * x; } }
    env[w] = Math.sqrt(s / (W * ch));
  }
  let emax = 0; for (const e of env) emax = Math.max(emax, e);
  const thr = emax * Math.pow(10, activeDb / 20), on = emax * Math.pow(10, -40 / 20);
  let first = -1, last = -1;
  for (let w = 0; w < nw; w++) { if (env[w] > on && first < 0) first = w; if (env[w] > thr) last = w; }
  let sa = 0, na = 0;
  if (first >= 0) for (let w = first; w <= last; w++) { sa += env[w] * env[w]; na++; }
  let max100 = 0;
  for (let w = 0; w + 10 <= nw; w++) { let s = 0; for (let k = 0; k < 10; k++) s += env[w + k] * env[w + k]; max100 = Math.max(max100, Math.sqrt(s / 10)); }
  const seg = (a, b) => { // RMS between a and b seconds
    const wa = Math.max(0, Math.floor(a / 0.01)), wb = Math.min(nw, Math.floor(b / 0.01)); let s = 0;
    for (let w = wa; w < wb; w++) s += env[w] * env[w]; return Math.sqrt(s / Math.max(1, wb - wa));
  };
  return {
    seconds: n / sr, sampleRate: sr, channels: ch, peak, rms: Math.sqrt(sum / (n * ch)),
    rmsActive: na ? Math.sqrt(sa / na) : 0, rms100max: max100,
    onset: first >= 0 ? first * 0.01 : null, activeDur: last >= 0 ? (last + 1) * 0.01 - Math.max(0, first) * 0.01 : 0,
    nan, clipFrac: clip / (n * ch), dc: chDc.map((s) => s / n), rmsCh: chSum.map((s) => Math.sqrt(s / n)),
    envelope: Array.from({ length: Math.ceil(nw / 50) }, (_, k) => { let m = 0; for (let w = k * 50; w < Math.min(nw, (k + 1) * 50); w++) m = Math.max(m, env[w]); return +m.toFixed(5); }),
    seg: null, _seg: seg,
  };
}

function wavBase64(buf) {
  const ch = buf.numberOfChannels, n = buf.length, sr = buf.sampleRate;
  const ab = new ArrayBuffer(44 + n * ch * 2), dv = new DataView(ab);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); dv.setUint32(4, 36 + n * ch * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, ch, true); dv.setUint32(24, sr, true);
  dv.setUint32(28, sr * ch * 2, true); dv.setUint16(32, ch * 2, true); dv.setUint16(34, 16, true);
  str(36, 'data'); dv.setUint32(40, n * ch * 2, true);
  const data = Array.from({ length: ch }, (_, c) => buf.getChannelData(c));
  let o = 44;
  for (let i = 0; i < n; i++) {
    for (let c = 0; c < ch; c++) {
      let x = data[c][i]; if (!Number.isFinite(x)) x = 0; x = Math.max(-1, Math.min(1, x));
      dv.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true); o += 2;
    }
  }
  const u8 = new Uint8Array(ab); let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}

function pack(buf, extra = {}, segs = []) {
  const a = analyze(buf);
  a.segs = segs.map(([x, y]) => ({ from: x, to: y, rms: a._seg(x, y) }));
  delete a._seg; delete a.seg;
  return { ...a, ...extra, wav: wavBase64(buf) };
}

// ---------------------------------------------------------------- offline renders
window.renderSfx = async (name, { seconds, seed = 7, pos = null, listener = null, volume = 1, pitch = 1, wav = true } = {}) => {
  seconds = seconds ?? (SFX_DURATION[name] + 4.5);
  const ctx = new OfflineAudioContext(2, Math.round(seconds * SR), SR);
  const sys = new AudioSystem({ context: ctx, seed });
  await sys.unlock();
  if (listener) sys.setListener(listener);
  const h = sys.play(name, { pos, volume, pitch });
  const t0 = performance.now();
  const buf = await ctx.startRendering();
  const res = pack(buf, { name, renderMs: performance.now() - t0, handle: h && { pitch: h.pitch, timeScale: h.timeScale }, stats: sys.stats() });
  if (!wav) delete res.wav;
  return res;
};

window.renderMusic = async (state, { seconds = 20, seed = 11, step = 0.05, script = [], segs = [], fade = 0 } = {}) => {
  const ctx = new OfflineAudioContext(2, Math.round(seconds * SR), SR);
  const sys = new AudioSystem({ context: ctx, seed });
  await sys.unlock();
  const actions = script.slice().sort((a, b) => a[0] - b[0]);
  const q = 128 / SR, times = new Set();
  for (let t = step; t < seconds - step; t += step) times.add(Math.round(t / q) * q);
  let maxLive = 0;
  for (const t of [...times].sort((a, b) => a - b)) {
    ctx.suspend(t).then(() => {
      while (actions.length && actions[0][0] <= ctx.currentTime + 1e-6) {
        const [, fn, ...args] = actions.shift();
        sys[fn](...args);
      }
      sys.update(step);
      maxLive = Math.max(maxLive, sys.stats().voices.music);
      ctx.resume();
    });
  }
  sys.setMusic(state, { fade });
  sys.update(0);
  const t0 = performance.now();
  const buf = await ctx.startRendering();
  return pack(buf, { name: 'music_' + state, renderMs: performance.now() - t0, maxMusicVoices: maxLive, stats: sys.stats() }, segs);
};

// small-signal gain and steady-state ceiling of the master chain (limiter calibration)
window.calibrate = async () => {
  const out = {};
  for (const amp of [0.1, 0.4, 1.0, 2.0]) {
    const ctx = new OfflineAudioContext(2, SR, SR);
    const sys = new AudioSystem({ context: ctx, seed: 1 });
    await sys.unlock();
    const o = ctx.createOscillator(); o.frequency.value = 220;
    const g = ctx.createGain(); g.gain.value = amp;
    o.connect(g); g.connect(sys._eng.masterIn); o.start(0); o.stop(1);
    const buf = await ctx.startRendering();
    const d = buf.getChannelData(0); let pk = 0, pkAll = 0;
    for (let i = 0; i < d.length; i++) { pkAll = Math.max(pkAll, Math.abs(d[i])); if (i > SR / 2) pk = Math.max(pk, Math.abs(d[i])); }
    out[amp] = { steadyPeak: pk, gain: pk / amp, overallPeak: pkAll };
  }
  return out;
};

// ±5% per-call variation of pitch / timing
window.variation = async (name = 'hit_flesh', n = 40) => {
  const ctx = new OfflineAudioContext(2, SR, SR);
  const sys = new AudioSystem({ context: ctx, seed: 3 });
  await sys.unlock();
  const ps = [], ts = [];
  for (let i = 0; i < n; i++) { const h = sys.play(name, { delay: i * 0.01, pitch: 1 }); ps.push(h.pitch); ts.push(h.timeScale); }
  const span = (a) => [Math.min(...a), Math.max(...a)];
  return { pitch: span(ps), timeScale: span(ts), distinctPitches: new Set(ps.map((x) => x.toFixed(5))).size, n };
};

// ---------------------------------------------------------------- realtime smoke test
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
window.realtimeSmoke = async () => {
  const res = { steps: [] };
  const step = (k, v) => res.steps.push([k, v]);
  const sys = new AudioSystem();
  const unlocked = await sys.unlock();
  const ctx = sys.context;
  step('unlock', { unlocked, ready: sys.ready, state: ctx.state, sampleRate: ctx.sampleRate, baseLatency: ctx.baseLatency });
  const an = ctx.createAnalyser(); an.fftSize = 2048; sys._eng.output.connect(an);
  const buf = new Float32Array(an.fftSize);
  const level = async (ms) => { // max RMS over a window, polling every 30 ms
    let m = 0; const end = performance.now() + ms;
    while (performance.now() < end) {
      an.getFloatTimeDomainData(buf); let s = 0; for (const x of buf) s += x * x; m = Math.max(m, Math.sqrt(s / buf.length));
      sys.update(0.016); await sleep(30);
    }
    return +m.toFixed(5);
  };
  let frame = 0;
  const moveListener = () => { frame++; const a = frame * 0.05; sys.setListener({ position: { x: Math.sin(a) * 2, y: 1.6, z: 10 }, forward: { x: Math.sin(a), y: 0, z: -Math.cos(a) } }); };

  sys.setMusic('hymn', { fade: 0.5 });
  step('hymn', { level: await level(2500), stats: sys.stats() });
  sys.setMusic('tension', { fade: 1 });
  step('tension', { level: await level(1500), stats: sys.stats() });
  sys.setMusic('phase1', { fade: 1 });
  step('phase1', { level: await level(2500), stats: sys.stats() });
  const fired = [];
  for (let i = 0; i < SFX_NAMES.length; i++) {
    const name = SFX_NAMES[i];
    moveListener();
    const pos = i % 2 ? { x: (i % 5) - 2, y: 1, z: -10 + i } : null;
    const h = sys.play(name, { pos, volume: 0.8, pitch: 1, delay: i % 3 === 0 ? 0.05 : 0 });
    fired.push([name, !!h]);
    sys.update(0.016);
    await sleep(140);
  }
  step('sfx fired', { fired: fired.filter(([, ok]) => ok).length, of: SFX_NAMES.length, level: await level(800), stats: sys.stats() });
  // burst: voice limits
  for (let i = 0; i < 40; i++) sys.play('step_water', { pos: { x: 1, y: 0, z: 9 } });
  for (let i = 0; i < 12; i++) sys.play('sword_fly', { pos: { x: -3 + i, y: 3, z: -5 } });
  step('burst', { stats: sys.stats() });
  sys.duck(0.6, 1.5);
  sys.setVolumes({ master: 0.9, music: 0.8, sfx: 1 });
  sys.setMusic('phase2', { fade: 1.5 });
  step('phase2', { level: await level(3000), stats: sys.stats() });
  sys.setMusic('victory', { fade: 1 });
  step('victory', { level: await level(2000), stats: sys.stats() });
  sys.setMusic('defeat', { fade: 2 });
  step('defeat', { level: await level(1500), stats: sys.stats() });
  sys.setMusic('off', { fade: 0.5 });
  await level(10000); // let every tail finish
  step('off (after tails)', { level: await level(500), stats: sys.stats() });
  await sys.close();
  step('closed', { state: ctx.state });

  // music file override path: point the URL pattern at the rendered previews
  const sys2 = new AudioSystem({ musicUrl: (s) => `/test/audio_preview/music_${s}.wav` });
  await sys2.unlock();
  sys2.setMusic('phase1', { fade: 0.3 });
  const an2 = sys2.context.createAnalyser(); an2.fftSize = 2048; sys2._eng.output.connect(an2);
  await sleep(2500);
  an2.getFloatTimeDomainData(buf); let s2 = 0; for (const x of buf) s2 += x * x;
  const cur = sys2._dir.current;
  step('file override', { source: cur && cur.kind, url: cur && cur.url, mediaTime: cur && cur.el ? +cur.el.currentTime.toFixed(2) : null, level: +Math.sqrt(s2 / buf.length).toFixed(5), files: Object.keys(sys2._dir.files) });
  sys2.setMusic('off', { fade: 0.2 });
  await sleep(600);
  step('file override off', { stats: sys2.stats() });
  await sys2.close();
  return res;
};

// ---------------------------------------------------------------- manual audition UI
let live = null;
const getLive = async () => { if (!live) { live = new AudioSystem(); await live.unlock(); setInterval(() => live.update(0.016), 16); } return live; };
const log = (s) => { document.getElementById('log').textContent = s; };
const mk = (parent, label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; document.getElementById(parent).appendChild(b); return b; };
for (const s of MUSIC_STATES) mk('music', s, async () => { const a = await getLive(); a.setMusic(s, { fade: 2 }); log('music → ' + s); });
for (const n of SFX_NAMES) mk('sfx', n, async () => {
  const a = await getLive();
  const sp = document.getElementById('spatial').checked;
  const ang = Math.random() * Math.PI * 2, d = 2 + Math.random() * 20;
  const pos = sp ? { x: Math.cos(ang) * d, y: 1, z: Math.sin(ang) * d } : null;
  a.play(n, { pos });
  log(n + (pos ? ` at (${pos.x.toFixed(1)}, ${pos.z.toFixed(1)})` : ''));
});
document.getElementById('duck').onclick = async () => (await getLive()).duck(0.6, 1.5);
window.SFX_DURATION = SFX_DURATION;
for (const [id, key] of [['vm', 'master'], ['vmu', 'music'], ['vs', 'sfx']]) {
  document.getElementById(id).oninput = async (e) => (await getLive()).setVolumes({ [key]: +e.target.value });
}
window.__ready = true;
</script>
</body>
</html>
